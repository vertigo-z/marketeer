[package]
name = "economy"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36"
egui_plot = "0.37"
egui_commonmark = { version = "0.25", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = 1
codegen-units = 1
strip = true
lto = true
debug = false